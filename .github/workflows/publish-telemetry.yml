name: Publish Public Bench Snapshot
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-bench-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.repository == 'JuneKim0712/CAN-Testbench' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: public-snapshot-publisher
      - name: Publish read-only CAN data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 public-snapshot-publisher/github-action/lib/publish_snapshot.py
