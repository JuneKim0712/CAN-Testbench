name: Deploy Testbench Telemetry to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["CalSol Hardware Unit Tests"]
    types: [completed]
    branches: [ main ]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Telemetry Portal
    if: github.repository != 'CalSol/CAN_TestBench'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download Latest Telemetry Web Bundle (Workflow Run)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: telemetry-web-bundle
          path: telemetry-artifact/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update report data without replacing the current frontend
        if: github.event_name == 'workflow_run'
        run: |
          test -d telemetry-artifact/data
          cp -a telemetry-artifact/data/. web/data/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
