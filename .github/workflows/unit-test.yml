name: CalSol Hardware Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target subsystem to test ("auto", "all", or specific path)'
        required: false
        default: 'all'
        type: string
      port:
        description: 'Serial port override (optional)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Auto-Discover Subsystems & Settings
    runs-on: [ self-hosted, linux, ARM64 ]
    outputs:
      matrix: ${{ steps.discovery.outputs.matrix }}
      has_changes: ${{ steps.discovery.outputs.has_changes }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-Discover & Resolve Subsystems
        id: discovery
        env:
          INPUT_TARGET: ${{ inputs.target }}
          PORT_OVERRIDE: ${{ inputs.port }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 github-action/lib/auto_discover.py --repo-root .

  testbench:
    name: Test ${{ matrix.cfg.name }} (${{ matrix.cfg.port || 'auto' }})
    needs: discover
    if: needs.discover.outputs.has_changes == 'true'
    runs-on: [ self-hosted, linux, ARM64 ]
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        cfg: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Hardware Test Action
        uses: ./github-action
        with:
          target: ${{ matrix.cfg.target }}
          port: ${{ matrix.cfg.port }}
          timeout: ${{ matrix.cfg.timeout }}
