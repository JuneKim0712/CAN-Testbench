name: CalSol Hardware Testbench Runner

# Reusable workflow logic for CalSol hardware CI
# NOTE: push/pull_request triggers are disabled in this repo to prevent
# automatic runs here. Other repositories (e.g. Gen11-FW, JuneKim0712)
# call this workflow via workflow_call.

on:
  workflow_call:
    inputs:
      target:
        description: 'Target test directory in calling repository'
        required: true
        type: string
      port:
        description: 'Target serial port on Raspberry Pi'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      target:
        description: 'Target test directory'
        required: true
        type: string
      port:
        description: 'Target serial port'
        required: false
        type: string
        default: ''

jobs:
  testbench:
    name: Run Hardware Test (${{ inputs.target }})
    runs-on: [ self-hosted, linux, ARM64 ]
    timeout-minutes: 8

    steps:
      - name: Checkout Calling Repository
        uses: actions/checkout@v4

      - name: Checkout Testbench Runner Engine
        uses: actions/checkout@v4
        with:
          repository: CalSol/CAN_TestBench
          path: .calsol_testbench

      - name: Make Scripts Executable
        run: chmod +x .calsol_testbench/github-action/*.sh .calsol_testbench/github-action/lib/*.py

      - name: Execute On-Target Hardware Test
        run: |
          .calsol_testbench/github-action/cal-test.sh "${{ inputs.target }}" "${{ inputs.port }}"

      - name: Dump Failure Logs
        if: failure()
        run: |
          echo "### ⚠️ Build / Flash Debug Logs for ${{ inputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Click to view failure log output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f ".calsol_testbench/github-action/.logs/build.log" ]; then
            echo "=== BUILD LOG ==="
            tail -n 40 .calsol_testbench/github-action/.logs/build.log
          fi
          if [ -f ".calsol_testbench/github-action/.logs/flash.log" ]; then
            echo "=== FLASH LOG ==="
            tail -n 40 .calsol_testbench/github-action/.logs/flash.log
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
