name: CalSol Hardware Unit Tests

# Reusable workflow logic for CalSol hardware CI
# NOTE: Automatic triggers (push / pull_request) are disabled on CalSol/CAN_TestBench
# to prevent workflow execution here. Testing ground for workflows is JuneKim0712/CAN-Testbench.

on:
  workflow_call:
    inputs:
      target:
        description: 'Target subsystem to test ("auto", "all", or specific path)'
        required: false
        default: 'all'
        type: string
      port:
        description: 'Serial port override (optional)'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      target:
        description: 'Target subsystem to test ("auto", "all", or specific path)'
        required: false
        default: 'all'
        type: string
      port:
        description: 'Serial port override (optional)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Cloud Lint & Static Analysis
    if: github.repository != 'CalSol/CAN_TestBench'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Analysis Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck

      - name: Run Quality Gate Checks
        run: |
          chmod +x github-action/static-check.sh
          ./github-action/static-check.sh

  discover:
    name: Auto-Discover Subsystems & Settings
    if: github.repository != 'CalSol/CAN_TestBench'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.discovery.outputs.matrix }}
      has_changes: ${{ steps.discovery.outputs.has_changes }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Auto-Discover & Resolve Subsystems
        id: discovery
        env:
          INPUT_TARGET: ${{ inputs.target }}
          PORT_OVERRIDE: ${{ inputs.port }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 github-action/lib/auto_discover.py --repo-root .

  testbench:
    name: Test ${{ matrix.cfg.name }} (${{ matrix.cfg.port || 'auto' }})
    needs: [discover, static-analysis]
    if: github.repository != 'CalSol/CAN_TestBench' && needs.discover.outputs.has_changes == 'true'
    runs-on: [ self-hosted, linux, ARM64 ]
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        cfg: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Run Hardware Test Action
        uses: ./github-action
        with:
          target: ${{ matrix.cfg.target }}
          port: ${{ matrix.cfg.port }}
          timeout: ${{ matrix.cfg.timeout }}

      - name: Upload Trackside Firmware Binaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.cfg.name }}-firmware-binaries
          path: ${{ matrix.cfg.target }}/build/artifacts/
          retention-days: 14
          if-no-files-found: ignore

  report:
    name: CalSol Testbench Status Dashboard
    needs: [static-analysis, discover, testbench]
    if: github.repository != 'CalSol/CAN_TestBench' && always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download Build & Test Artifacts
        uses: actions/download-artifact@v8
        with:
          path: pr_artifacts
        continue-on-error: true

      - name: Generate Dashboard & Status Report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 github-action/lib/pr_reporter.py --artifacts-dir pr_artifacts
