name: CalSol Hardware Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target subsystem test directory'
        required: true
        default: 'unit-testing/fw-lab-examples/brakelights/test'
        type: choice
        options:
          - 'unit-testing/fw-lab-examples/brakelights/test'
          - 'unit-testing/fw-lab-examples/pedals/test'
  workflow_call:
    inputs:
      target:
        description: 'Target subsystem test directory'
        required: true
        type: string
        default: 'unit-testing/fw-lab-examples/brakelights/test'
      port:
        description: 'Target serial port'
        required: false
        type: string
        default: ''

jobs:
  testbench:
    name: Test ${{ matrix.subsystem || inputs.target || 'Subsystem' }}
    runs-on: [ self-hosted, linux, ARM64 ]
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        subsystem: [ 'unit-testing/fw-lab-examples/brakelights/test', 'unit-testing/fw-lab-examples/pedals/test' ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Scripts Executable
        run: chmod +x server/*.sh server/lib/*.py

      - name: Run Hardware Unit Tests
        run: |
          TARGET="${{ inputs.target || matrix.subsystem }}"
          PORT="${{ inputs.port || '' }}"
          ./server/cal-test.sh "$TARGET" "$PORT"

      - name: Dump Failure Logs
        if: failure()
        run: |
          echo "### ⚠️ Build / Flash Debug Logs for ${{ matrix.subsystem || inputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Click to view failure log output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f "server/.logs/build.log" ]; then
            echo "=== BUILD LOG ==="
            tail -n 40 server/.logs/build.log
          fi
          if [ -f "server/.logs/flash.log" ]; then
            echo "=== FLASH LOG ==="
            tail -n 40 server/.logs/flash.log
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
