name: 'CalSol Hardware Testbench Runner'
description: 'Automated On-Target ESP32-S3 firmware build, flash, and Unity test runner on CalSol bench hardware'
author: 'CalSol'
inputs:
  target:
    description: 'Target test directory (e.g. lights_fw/test) or pre-built binary'
    required: true
    default: 'test'
  port:
    description: 'Target serial port override on Raspberry Pi (e.g. /dev/esp32_johnathan)'
    required: false
    default: ''
  timeout:
    description: 'Maximum test duration in seconds'
    required: false
    default: '12'

runs:
  using: 'composite'
  steps:
    - name: Make Scripts Executable
      shell: bash
      run: chmod +x ${{ github.action_path }}/*.sh ${{ github.action_path }}/lib/*.py

    - name: Execute On-Target Hardware Test
      shell: bash
      run: |
        ${{ github.action_path }}/cal-test.sh "${{ inputs.target }}" "${{ inputs.port }}" "${{ inputs.timeout }}"

    - name: Dump Failure Logs
      if: failure()
      shell: bash
      run: |
        echo "### Failure Diagnostics for ${{ inputs.target }}" >> $GITHUB_STEP_SUMMARY
        echo "<details open><summary><b>Click to inspect step execution logs</b></summary>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```text' >> $GITHUB_STEP_SUMMARY
        if [ -f "${{ github.action_path }}/.logs/build.log" ]; then
            echo "--- Build Output (last 30 lines) ---" >> $GITHUB_STEP_SUMMARY
            tail -n 30 "${{ github.action_path }}/.logs/build.log" >> $GITHUB_STEP_SUMMARY
        fi
        if [ -f "${{ github.action_path }}/.logs/flash.log" ]; then
            echo "--- Flash Output (last 30 lines) ---" >> $GITHUB_STEP_SUMMARY
            tail -n 30 "${{ github.action_path }}/.logs/flash.log" >> $GITHUB_STEP_SUMMARY
        fi
        for f in "${{ github.action_path }}/.logs"/*_serial.log; do
            if [ -f "$f" ]; then
                echo "--- Serial Output: $(basename "$f") (last 30 lines) ---" >> $GITHUB_STEP_SUMMARY
                tail -n 30 "$f" >> $GITHUB_STEP_SUMMARY
            fi
        done
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "</details>" >> $GITHUB_STEP_SUMMARY
