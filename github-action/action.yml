name: 'CalSol Hardware Testbench Runner'
description: 'Automated On-Target ESP32-S3 firmware build, flash, and Unity test runner on CalSol bench hardware'
author: 'CalSol'
inputs:
  target:
    description: 'Target test directory (e.g. lights_fw/test) or pre-built binary'
    required: true
    default: 'test'
  port:
    description: 'Target serial port override on Raspberry Pi (e.g. /dev/esp32_johnathan)'
    required: false
    default: ''
  timeout:
    description: 'Maximum test duration in seconds'
    required: false
    default: '12'

runs:
  using: 'composite'
  steps:
    - name: Make Scripts Executable
      shell: bash
      run: chmod +x ${{ github.action_path }}/*.sh ${{ github.action_path }}/lib/*.py

    - name: Execute On-Target Hardware Test
      shell: bash
      run: |
        ${{ github.action_path }}/cal-test.sh "${{ inputs.target }}" "${{ inputs.port }}" "${{ inputs.timeout }}"

    - name: Dump Failure Logs
      if: failure()
      shell: bash
      run: |
        echo "### ⚠️ Build / Flash Failure Logs for ${{ inputs.target }}" >> $GITHUB_STEP_SUMMARY
        echo "<details><summary>Click to view failure logs</summary>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```text' >> $GITHUB_STEP_SUMMARY
        [ -f "${{ github.action_path }}/.logs/build.log" ] && tail -n 40 ${{ github.action_path }}/.logs/build.log
        [ -f "${{ github.action_path }}/.logs/flash.log" ] && tail -n 40 ${{ github.action_path }}/.logs/flash.log
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "</details>" >> $GITHUB_STEP_SUMMARY
